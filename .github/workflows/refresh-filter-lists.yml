name: Refresh Ghost Cookie filter lists

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/refresh-filter-lists.yml
      - scripts/update-lists.mjs
      - scripts/compile-filters.mjs
      - scripts/compile-reputation.mjs
      - tests/browser-smoke.mjs

permissions:
  contents: read

concurrency:
  group: filter-lists-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Compile source revisions and compare effective rules
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_dir="$RUNNER_TEMP/filter-update"
          node scripts/update-lists.mjs "$report_dir"
          cat "$report_dir/summary.md" >> "$GITHUB_STEP_SUMMARY"
          git diff --binary -- rules/easylist.lock.json rules/easylist.json rules/easyprivacy.json \
            rules/cosmetic-selectors.js reputation/source.json rules/reputation.json > "$report_dir/lists.patch"
          if [[ -s "$report_dir/lists.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the packaged extension in Chrome and Edge
        run: |
          npm test
          npm run build
          version=$(node -p "require('./manifest.json').version")
          python3 -m zipfile -e "dist/ghost-cookie-v$version.zip" "$RUNNER_TEMP/extension"
          node tests/browser-smoke.mjs "$(command -v google-chrome)" "$RUNNER_TEMP/extension"
          # The runner image can install Edge without the required setuid bit.
          sudo chown root:root /opt/microsoft/msedge/msedge-sandbox
          sudo chmod 4755 /opt/microsoft/msedge/msedge-sandbox
          node tests/browser-smoke.mjs "$(command -v microsoft-edge)" "$RUNNER_TEMP/extension"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.changed == 'true'
        with:
          name: filter-list-changes
          path: ${{ runner.temp }}/filter-update
          if-no-files-found: error

  propose:
    needs: prepare
    if: >-
      ${{ needs.prepare.outputs.changed == 'true' &&
          github.ref_name == github.event.repository.default_branch &&
          github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: filter-list-changes
          path: ${{ runner.temp }}/filter-update
      - name: Open a pull request for human review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_pr=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == .base.repo.full_name and
              .user.login == "github-actions[bot]" and (.head.ref | startswith("automation/filter-lists-"))) | .html_url')
          if [[ -n "$open_pr" ]]; then
            printf 'Ya hay una propuesta abierta para revisión.\n%s\n' "$open_pr" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          report_dir="$RUNNER_TEMP/filter-update"
          branch="automation/filter-lists-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git apply --index "$report_dir/lists.patch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Update bundled Ghost Cookie filter lists"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"

          printf '\nEl [informe completo de reglas añadidas y retiradas](%s/%s/actions/runs/%s) está en el artefacto `filter-list-changes`.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$report_dir/summary.md"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Actualizar EasyList, EasyPrivacy y PhishDestroy" --body-file "$report_dir/summary.md"
