name: Verify Ghost Cookie

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-extension-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Verify ZIP in Chrome and Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bash scripts/verify-extension.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ghost-cookie-store-package
          path: |
            dist/ghost-cookie-v*.zip
            dist/ghost-cookie-v*-SHA256SUMS.txt
          if-no-files-found: error
