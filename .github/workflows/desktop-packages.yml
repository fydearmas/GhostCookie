name: Ghost Cookie desktop packages

on:
  push:
    branches: ['codex/release-*']
  workflow_dispatch:
    inputs:
      signed:
        description: Build production-signed installers using the store IDs and signing environment
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s native -v
      - run: python scripts/package-release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-and-assistant-source
          path: |
            dist/*.zip
            dist/*-SHA256SUMS.txt
          if-no-files-found: error

  windows:
    needs: extension
    if: ${{ !inputs.signed || github.ref == 'refs/heads/main' }}
    environment: ${{ inputs.signed && 'desktop-signing' || 'desktop-test' }}
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CHROME_ID: ${{ vars.GHOSTCOOKIE_CHROME_STORE_ID }}
      EDGE_ID: ${{ vars.GHOSTCOOKIE_EDGE_STORE_ID }}
      SIGNED_BUILD: ${{ inputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -r packaging/windows/requirements-build.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build unsigned package for testing
        if: ${{ !inputs.signed }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chrome = if ($env:CHROME_ID) { $env:CHROME_ID } else { 'a' * 32 }
          $edge = if ($env:EDGE_ID) { $env:EDGE_ID } else { 'b' * 32 }
          ./packaging/windows/build.ps1 -ChromeExtensionId $chrome -EdgeExtensionId $edge -UnsignedDevelopment
      - name: Build and sign Windows package
        if: ${{ inputs.signed }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CHROME_ID -notmatch '^[a-p]{32}$' -or $env:EDGE_ID -notmatch '^[a-p]{32}$') {
            throw 'Faltan los IDs oficiales de Chrome y Edge.'
          }
          if (!$env:WINDOWS_SIGNING_PFX_BASE64 -or !$env:WINDOWS_SIGNING_PFX_PASSWORD -or $env:WINDOWS_SIGNING_THUMBPRINT -notmatch '^[a-fA-F0-9]{40}$') {
            throw 'Falta el certificado de firma de Windows o su huella.'
          }
          $file = Join-Path $env:RUNNER_TEMP 'ghostcookie-signing.pfx'
          $cert = "Cert:\CurrentUser\My\$env:WINDOWS_SIGNING_THUMBPRINT"
          try {
            [IO.File]::WriteAllBytes($file, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_PFX_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $file -CertStoreLocation 'Cert:\CurrentUser\My' -Password $password | Out-Null
            Remove-Item Env:WINDOWS_SIGNING_PFX_BASE64, Env:WINDOWS_SIGNING_PFX_PASSWORD
            Remove-Item -LiteralPath $file
            if (!(Test-Path -LiteralPath $cert)) { throw 'El certificado no coincide con la huella configurada.' }
            ./packaging/windows/build.ps1 -ChromeExtensionId $env:CHROME_ID -EdgeExtensionId $env:EDGE_ID -CertificateThumbprint $env:WINDOWS_SIGNING_THUMBPRINT
          } finally {
            if (Test-Path -LiteralPath $file) { Remove-Item -LiteralPath $file -Force }
            if (Test-Path -LiteralPath $cert) { Remove-Item -LiteralPath $cert -Force }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-${{ inputs.signed && 'signed' || 'development' }}
          path: |
            dist/installers/*.exe
            dist/installers/*.sha256
          if-no-files-found: error

  macos:
    needs: extension
    if: ${{ !inputs.signed || github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.signed && 'desktop-signing' || 'desktop-test' }}
    timeout-minutes: 65
    env:
      CHROME_ID: ${{ vars.GHOSTCOOKIE_CHROME_STORE_ID }}
      EDGE_ID: ${{ vars.GHOSTCOOKIE_EDGE_STORE_ID }}
      SIGNED_BUILD: ${{ inputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare bundle metadata and build dependencies
        shell: bash
        run: |
          python -m pip install -r native/requirements.txt -r packaging/macos/build-requirements.txt
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          ids = {"chrome": os.environ["CHROME_ID"], "edge": os.environ["EDGE_ID"]}
          if os.environ["SIGNED_BUILD"] != "true":
              ids = {"chrome": ids["chrome"] or "a" * 32, "edge": ids["edge"] or "b" * 32}
          if any(re.fullmatch(r"[a-p]{32}", value) is None for value in ids.values()):
              raise SystemExit("Faltan los IDs oficiales de Chrome y Edge.")
          (Path(os.environ["RUNNER_TEMP"]) / "official-extension-ids.json").write_text(json.dumps(ids))
          PY
      - name: Build unsigned package for testing
        if: ${{ !inputs.signed }}
        shell: bash
        run: bash packaging/macos/build.sh --unsigned "$RUNNER_TEMP/official-extension-ids.json"
      - name: Sign, notarize and staple the macOS package
        if: ${{ inputs.signed }}
        shell: bash
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          MACOS_NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ vars.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ vars.MACOS_NOTARY_ISSUER }}
          MACOS_APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          : "${MACOS_SIGNING_P12_PASSWORD:?Falta la contraseña del certificado macOS}"
          : "${MACOS_NOTARY_KEY_ID:?Falta el ID de notarización}"
          : "${MACOS_NOTARY_ISSUER:?Falta el emisor de notarización}"
          : "${MACOS_APPLICATION_IDENTITY:?Falta Developer ID Application}"
          : "${MACOS_INSTALLER_IDENTITY:?Falta Developer ID Installer}"
          umask 077
          cert="$RUNNER_TEMP/ghostcookie-signing.p12"
          notary_key="$RUNNER_TEMP/ghostcookie-notary.p8"
          export MACOS_NOTARY_KEYCHAIN="$RUNNER_TEMP/ghostcookie-signing.keychain-db"
          export MACOS_NOTARY_PROFILE="ghostcookie-notary"
          cleanup() {
            rm -f "$cert" "$notary_key"
            security delete-keychain "$MACOS_NOTARY_KEYCHAIN" 2>/dev/null || true
          }
          trap cleanup EXIT
          python - "$cert" "$notary_key" <<'PY'
          import base64, os, sys
          from pathlib import Path
          for name, path in zip(("MACOS_SIGNING_P12_BASE64", "MACOS_NOTARY_API_KEY_BASE64"), sys.argv[1:]):
              value = os.environ[name]
              if not value:
                  raise SystemExit(f"Falta {name}.")
              Path(path).write_bytes(base64.b64decode(value, validate=True))
          PY
          unset MACOS_SIGNING_P12_BASE64 MACOS_NOTARY_API_KEY_BASE64
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$MACOS_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 3900 "$MACOS_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$password" "$MACOS_NOTARY_KEYCHAIN"
          security list-keychains -d user -s "$MACOS_NOTARY_KEYCHAIN"
          security import "$cert" -k "$MACOS_NOTARY_KEYCHAIN" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          unset MACOS_SIGNING_P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$MACOS_NOTARY_KEYCHAIN"
          rm -f "$cert"
          xcrun notarytool store-credentials "$MACOS_NOTARY_PROFILE" --key "$notary_key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" --keychain "$MACOS_NOTARY_KEYCHAIN"
          rm -f "$notary_key"
          bash packaging/macos/build.sh "$RUNNER_TEMP/official-extension-ids.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.runner }}-${{ inputs.signed && 'signed' || 'development' }}
          path: dist/*.pkg
          if-no-files-found: error
