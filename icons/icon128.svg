<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shield base -->
  <path d="M64 8L16 24v32c0 35.36 20.48 59.6 48 72 27.52-12.4 48-36.64 48-72V24L64 8z" fill="url(#grad)" filter="url(#glow)"/>
  
  <!-- Inner shield highlight -->
  <path d="M64 18L26 31v23c0 30.24 16.64 51.2 38 62 21.36-10.8 38-31.76 38-62V31L64 18z" fill="url(#inner)" opacity="0.15"/>
  
  <!-- Lock body -->
  <rect x="44" y="56" width="40" height="32" rx="4" fill="white" filter="url(#shadow)"/>
  
  <!-- Lock shackle -->
  <path d="M52 56V46a12 12 0 0 1 24 0v10" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="64" cy="70" r="5" fill="#6366f1"/>
  <path d="M64 74v8" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
</svg>
