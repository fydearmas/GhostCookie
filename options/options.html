<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajustes de Ghost Cookie</title>
  <link rel="stylesheet" href="../popup/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="standalone">
  <main class="settings-shell options-shell">
    <header class="settings-header">
      <img src="../icons/icon48.png" width="44" height="44" alt="">
      <div><p class="section-label">Ghost Cookie <span id="version"></span></p><h1>Ajustes</h1></div>
    </header>

    <section class="settings-card" aria-labelledby="filtersHeading">
      <h2 id="filtersHeading">Protección</h2>
      <label class="setting"><input id="globalProtection" type="checkbox" disabled> Activar filtros y avisos de phishing</label>
      <label class="setting"><input id="classifyCookies" type="checkbox" disabled> Mostrar categorías estimadas de cookies</label>
      <label class="setting"><input id="regionalProtection" type="checkbox" aria-describedby="regionalHelp" disabled> Filtro adicional para sitios en español y portugués</label>
      <p id="regionalHelp" class="muted">Añade el filtro regional de AdGuard. Si un sitio falla tras activarlo, puedes desmarcarlo aquí.</p>
      <section class="list-versions" aria-labelledby="listVersionsHeading">
        <h3 id="listVersionsHeading">Listas instaladas</h3>
        <dl>
          <div><dt>EasyList y EasyPrivacy</dt><dd id="easyListDate">Consultando…</dd></div>
          <div><dt>AdGuard Español/Portugués</dt><dd id="regionalListDate">Consultando…</dd></div>
          <div><dt>PhishDestroy</dt><dd id="phishListDate">Consultando…</dd></div>
        </dl>
      </section>
      <details id="pauseDetails">
        <summary id="pausedSummary">Sitios en pausa</summary>
        <ul id="pausedSites" class="paused-list"></ul>
        <p id="pausedEmpty" class="muted" hidden>No hay sitios en pausa.</p>
        <button id="resetPauses" class="button quiet" disabled>Reanudar todos los sitios</button>
      </details>
      <p id="protectionStatus" class="status" role="status"></p>
    </section>

  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
